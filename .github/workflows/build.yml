name: Build Surge Radar APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub-hosted Android runners already contain the Android SDK.
      # We intentionally do NOT use android-actions/setup-android here because
      # that action can try to install the removed legacy "tools" package.
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "Android SDK: $SDK_ROOT"

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found on the GitHub runner."
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Locate project (ZIP or plain files)
        shell: bash
        run: |
          set -e
          ARCHIVE="$(ls -1 ./*.zip 2>/dev/null | head -n 1 || true)"

          if [ -n "$ARCHIVE" ]; then
            echo "Using archive: $ARCHIVE"
            rm -rf project
            mkdir project
            unzip -q "$ARCHIVE" -d project
            if [ -f "project/build.gradle" ] && [ -d "project/app" ]; then
              PROJECT_DIR="project"
            else
              PROJECT_DIR="$(find project -mindepth 1 -maxdepth 2 -name settings.gradle -type f -printf '%h\n' | head -n 1)"
            fi
          elif [ -f "build.gradle" ] && [ -d "app" ]; then
            echo "No ZIP found, using repository files directly"
            PROJECT_DIR="."
          else
            echo "ERROR: no ZIP archive and no Gradle project in the repository root."
            ls -la
            exit 1
          fi

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "ERROR: Android project was not found."
            find . -maxdepth 3 -type f -not -path './.git/*' | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SurgeRadar-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
